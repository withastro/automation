name: Draft release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  draft-release:
    if: github.repository == 'withastro/automation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
